name = "motto-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "motto-mail-db"
database_id = "b100a268-f1f5-44b8-aff6-f03edbe1fdc9"

[[kv_namespaces]]
binding = "kv"
id = "3c3f4d719a61480e887a19805861978b"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "ws"
class_name = "MailHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailHub"]

[vars]
domain = ["motto.email"]
admin = "admin@motto.email"
orm_log = false

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
